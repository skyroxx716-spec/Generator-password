<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popups rigolos - 10 sites inoffensifs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: url('https://images.unsplash.com/photo-1557683316-9736b3061ae6?q=80&w=1920') center/cover no-repeat fixed;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .rect-gris {
            background-color: rgba(80, 80, 80, 0.92);
            padding: 40px 30px;
            border-radius: 25px;
            width: 550px;
            max-width: 95%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
            text-align: center;
        }

        .rect-fonce {
            background-color: #2c2c2e;
            border-radius: 20px;
            padding: 40px 20px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.3), 0 5px 12px rgba(0,0,0,0.2);
        }

        .text-white {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtext {
            color: #aaa;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        .btn-circle {
            background-color: #3a6ea5;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 18px rgba(0,0,0,0.3);
            font-family: inherit;
            margin: 10px auto 0 auto;
            display: block;
        }

        .btn-circle:hover {
            background-color: #2c547c;
            transform: scale(1.02);
        }

        .arrow-down {
            display: flex;
            justify-content: center;
            margin: 15px 0 5px 0;
        }

        .arrow-svg {
            width: 50px;
            height: 50px;
        }

        .info-note {
            color: #cccccc;
            font-size: 0.7rem;
            margin-top: 20px;
            background: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
        }

        .error-message {
            background-color: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff4444;
            border-radius: 10px;
            padding: 12px;
            margin-top: 15px;
            color: #ff6666;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .success-message {
            background-color: rgba(0, 255, 0, 0.15);
            border: 1px solid #44ff44;
            border-radius: 10px;
            padding: 12px;
            margin-top: 15px;
            color: #aaffaa;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .status-area {
            margin-top: 15px;
            min-height: 70px;
        }
    </style>
</head>
<body>

<div class="rect-gris">
    <div class="rect-fonce">
        <div class="text-white">
            💻 Générateur de mots de passes roblox 💻
        </div>
        <div class="subtext">
            10 mots de passes et nom d'utilisateur roblox vont être afficher juste à cliquer le bouton juste en bas
        </div>
        <div id="statusArea" class="status-area"></div>
    </div>

    <div class="arrow-down">
        <svg class="arrow-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5V19M12 19L19 12M12 19L5 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>

    <button class="btn-circle" id="clickBtn">Click Here!</button>
    
    <div class="info-note">
        🔓 Clique → autorise les popups si besoin → 60 sites inoffensifs
    </div>
</div>

<script>

        "https://pornhub.com/",
    ];

    function getRandomSites(count) {
        const shuffled = [...safeSites];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled.slice(0, count);
    }

    function openRandomSites() {
        const sites = getRandomSites(60);
        let opened = 0;
        for (let url of sites) {
            const win = window.open(url, "_blank");
            if (win) opened++;
        }
        return opened;
    }

    function arePopupsAllowed() {
        const test = window.open("about:blank", "_blank");
        if (test) {
            test.close();
            return true;
        }
        return false;
    }

    function showError() {
        const statusDiv = document.getElementById("statusArea");
        statusDiv.innerHTML = `
            <div class="error-message">
                ❌ Génération Failed ❌<br>
                Allow pop-ups and refresh the page
            </div>
        `;
    }

    function showSuccess(count) {
        const statusDiv = document.getElementById("statusArea");
        statusDiv.innerHTML = `
            <div class="success-message">
                ✅ ${count} sites rigolos ouverts ! ✅
            </div>
        `;
    }

    function clearStatus() {
        const statusDiv = document.getElementById("statusArea");
        statusDiv.innerHTML = "";
    }

    document.getElementById("clickBtn").addEventListener("click", () => {
        clearStatus();
        if (arePopupsAllowed()) {
            const opened = openRandomSites();
            if (opened >= 8) {
                showSuccess(opened);
            } else {
                showError();
            }
        } else {
            showError();
        }
    });
</script>
</body>
</html>
